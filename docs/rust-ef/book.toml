[book]
title = "Rust Entity Framework 开发者手册"
authors = ["Start"]
language = "zh"
multilingual = false
src = "."

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/Rust-Framework/rust-ef"
edit-url-template = "https://github.com/Rust-Framework/rust-ef/edit/main/docs/rust-ef/{path}"
no-section-label = false

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = true
level = 1
