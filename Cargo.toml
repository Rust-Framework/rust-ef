[workspace]
members = [
    "crates/core",
    "crates/macros",
    "crates/postgres",
    "crates/mysql",
    "crates/sqlite",
    "crates/cli",
    "examples/blog",
    "examples/soft_delete",
    "examples/audit",
]
resolver = "2"

[workspace.package]
version = "1.8.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Rust-Framework/rust-ef"
authors = ["Start"]

[workspace.dependencies]
inventory = "0.3"
