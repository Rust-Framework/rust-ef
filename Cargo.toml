[workspace]
members = [
    "crates/core",
    "crates/macros",
    "crates/postgres",
    "crates/mysql",
    "crates/sqlite",
    "crates/cli",
    "examples/blog",
    "examples/soft_delete",
    "examples/audit",
    "examples/providers",
]
resolver = "2"

[workspace.package]
version = "2.9.1"
edition = "2021"
rust-version = "1.95"
license = "MIT"
homepage = "https://rust-framework.github.io/rust-ef/"
repository = "https://github.com/Rust-Framework/rust-ef"
authors = ["Start"]

[workspace.dependencies]
inventory = "0.3"
# Contract types (`PagedRequest`/`PagedResult`) for `QueryBuilder::to_page`.
# `version` is what gets published; `path` serves the sibling-checkout layout
# (rust-dix is a separate repository, so CI checks it out next to rust-ef).
rust-core = { version = "0.1", path = "../rust-dix/crates/core" }

# ---------------------------------------------------------------------------
# Build profiles tuned for `target/` disk usage.
#
# Two things made `target/` grow to ~80 GB on Windows:
#   1. full debug info for *every* dependency: MSVC writes one .pdb per linked
#      binary, and each integration test here links the whole crate
#      (~80 MB of symbols per test binary, ~26 GB of .pdb + .exe in total);
#   2. incremental session directories under `target/debug/incremental` for
#      every feature/toolchain variant of every test target (~47 GB observed
#      after weeks of `--all-features` / `chrono,uuid,decimal` gate runs).
#
# What these profiles do:
#   * workspace crates keep line tables, so panics and backtraces still print
#     `file:line` (full type info is what dominates MSVC .pdb size);
#   * dependencies carry no debug info (they are read, not single-stepped);
#   * test/bench units stop using incremental compilation, which removes the
#     largest and most frequently orphaned cache category;
#   * plain `dev`/`check` builds keep incremental, so the edit-compile loop
#     stays fast. Re-enable it for test builds with
#     CARGO_PROFILE_TEST_INCREMENTAL=true (same pattern as rust-webx/rust-dix).
#
# Reclaiming space: `cargo clean` removes everything; the cheaper prune is to
# delete `target/debug/incremental` only.
# ---------------------------------------------------------------------------
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
debug = false

[profile.bench]
incremental = false

# ---------------------------------------------------------------------------
# cargo-semver-checks allowlist — documented breaking changes of 2.9.0.
#
# CI (`.github/workflows/ci.yml`, job `semver`) checks the public API against
# `--baseline-rev v2.6.0`, the last published tag; this release ships as 2.9.0
# in pair with rust-webx 2.9.0.
#
# Every entry below is one of the *documented* breaking changes listed in
# CHANGELOG.md "Breaking" for 2.9.0 and in docs/v2.9-migration-guide.md §3.
# cargo-semver-checks configures lint levels per lint (not per item), so an
# allow covers the whole lint for this run; the comments pin down which
# documented changes it exists for. Everything not listed here must still fail
# the job. Revisit these entries when `--baseline-rev` moves past v2.6.0.
# ---------------------------------------------------------------------------
[workspace.metadata.cargo-semver-checks.lints]
# `JoinSpec` was rewritten from `{ join_type, table, on_clause }` to
# `{ kind, table, keys }`, and `QueryState` replaced its public SELECT-list
# fields (`projected_columns`, `is_count`, `is_exists`, `aggregate`,
# `aggregate_column`) with accessor methods. CHANGELOG 2.9.0 "Breaking";
# migration guide §3 items 1-2.
struct_pub_field_missing = "allow"
# `JoinSpec` and `QueryState` are now `#[non_exhaustive]` so future shape
# additions stay non-breaking. Construct them through `JoinSpec::new(...)` /
# `QueryState::new(table)`; struct-literal construction was already impossible
# for `QueryState` because of its private state. CHANGELOG 2.9.0 "Breaking";
# migration guide §3 items 1-2.
struct_marked_non_exhaustive = "allow"
# `BoolExpr` and `HavingExpr` are now `#[non_exhaustive]`; exhaustive downstream
# `match` needs a wildcard arm. This is the one-time cost of making future AST
# additions (e.g. `BoolExpr::Compare`) non-breaking. CHANGELOG 2.9.0 "Breaking";
# migration guide §3 item 4.
enum_marked_non_exhaustive = "allow"
# `ExecuteUpdateBuilder::set_column_internal` — deprecated since 2.3.0 and
# documented as "kept for one release" — was removed in 2.9.0; `set_column` is
# the replacement. CHANGELOG 2.9.0 "Breaking"; migration guide §3 item 5.
inherent_method_missing = "allow"
# `IRow` / `IFromRow` were merged: `IRow` no longer has `IEntityType` as a
# supertrait (entities, `#[derive(FromRow)]` structs and tuples implement it);
# `entity::IFromRow` stays as a compatibility alias. Downstream `T: IFromRow`
# code no longer gets the `IEntityType` / `Send + Sync + 'static` bounds
# implicitly. CHANGELOG 2.9.0 "Breaking"; migration guide §3 item 6.
trait_removed_supertrait = "allow"
# `HavingExpr` was removed as a dedicated enum: it is now an alias for
# `BoolExpr`, whose `Compare` variant carries `{ left, op, right }` instead of
# the old `{ agg, col, op, value }`, and the old `CompareAgg` variant became
# `BoolExpr::aggregate_compare_agg(...)` (no public enum variant). This is the
# documented "one expression core" break of 2.9.0 (CHANGELOG "Breaking";
# migration guide section 3 items 9-10). `ColumnExpr` likewise became an alias
# for `SqlExpr`.
enum_struct_variant_field_added = "allow"
enum_struct_variant_field_missing = "allow"
enum_variant_missing = "allow"
