name: Publish to crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 2.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $version"

      - name: Check tag/version consistency
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --no-deps --format-version 1)"
          ws_version="$(printf '%s' "$metadata" | jq -r '.packages[] | select(.name=="rust-ef") | .version')"
          if [ "$ws_version" != "$VERSION" ]; then
            echo "::error::workspace version $ws_version != release version $VERSION"
            exit 1
          fi
          for name in rust-ef-macros rust-ef rust-ef-sqlite rust-ef-postgres rust-ef-mysql; do
            version="$(printf '%s' "$metadata" | jq -r --arg n "$name" '.packages[] | select(.name==$n) | .version')"
            if [ "$version" != "$VERSION" ]; then
              echo "::error::$name version $version != release version $VERSION"
              exit 1
            fi
          done

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests (SQLite; PG/MySQL run in CI matrix)
        run: cargo test --workspace --all-features -- --skip postgres --skip mysql

      - name: Packaging check
        run: |
          set -euo pipefail
          # `cargo publish` performs the full package verification for each
          # dependent crate once its dependencies are visible on crates.io.
          # Preflight validates the leaf crate end-to-end and every crate's
          # file list/manifest before the first upload.
          cargo package -p rust-ef-macros
          for name in rust-ef rust-ef-sqlite rust-ef-postgres rust-ef-mysql; do
            echo "::group::Packaging $name"
            cargo package -p "$name" --no-verify --list > "/tmp/$name.files"
            grep -qx "README.md" "/tmp/$name.files" \
              || { echo "::error::$name package is missing README.md"; exit 1; }
            grep -qx "Cargo.toml" "/tmp/$name.files" \
              || { echo "::error::$name package is missing Cargo.toml"; exit 1; }
            echo "::endgroup::"
          done

      - name: MSRV check (1.95)
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Check workspace on MSRV
        run: cargo check --workspace --all-targets --all-features

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Audit dependencies
        run: cargo audit

  publish:
    name: Publish
    needs: [preflight, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish crates (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          # crates.io rejects requests without an identifying User-Agent (403).
          CURL_UA: "rust-ef-release-workflow (https://github.com/Rust-Framework/rust-ef)"
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set."
            exit 1
          fi

          CRATES="rust-ef-macros rust-ef rust-ef-sqlite rust-ef-postgres rust-ef-mysql"
          metadata="$(cargo metadata --no-deps --format-version 1)"

          for name in $CRATES; do
            version="$(printf '%s' "$metadata" \
              | jq -r --arg n "$name" '.packages[] | select(.name==$n) | .version')"
            if [ "$version" != "${VERSION}" ]; then
              echo "::error::$name version $version != release version ${VERSION}"
              exit 1
            fi

            if curl -fsS -A "${CURL_UA}" "https://crates.io/api/v1/crates/$name/$version" > /dev/null; then
              echo "::notice::$name@$version is already published; skipping"
              continue
            fi

            echo "::group::Publishing $name@$version"
            published=0
            for attempt in 1 2 3; do
              if cargo publish -p "$name" --token "${CARGO_REGISTRY_TOKEN}"; then
                published=1
                break
              fi
              # A failed attempt may still have reached crates.io; also retry
              # after a short wait so dependency index propagation can settle.
              if curl -fsS -A "${CURL_UA}" "https://crates.io/api/v1/crates/$name/$version" > /dev/null; then
                published=1
                break
              fi
              echo "publish attempt ${attempt} failed; retrying in 30s"
              sleep 30
            done
            if [ "$published" != "1" ]; then
              echo "::error::failed to publish $name@$version"
              exit 1
            fi

            # Dependents in this order require the version to be visible.
            for _ in $(seq 1 30); do
              if curl -fsS -A "${CURL_UA}" "https://crates.io/api/v1/crates/$name/$version" > /dev/null; then
                break
              fi
              sleep 10
            done
            if ! curl -fsS -A "${CURL_UA}" "https://crates.io/api/v1/crates/$name/$version" > /dev/null; then
              echo "::error::$name@$version is not visible on crates.io after publish"
              exit 1
            fi
            echo "::endgroup::"
          done
