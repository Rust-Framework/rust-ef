name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (chrono/uuid/decimal features)
        run: cargo clippy --workspace --all-targets --features chrono,uuid,decimal -- -D warnings

  test:
    name: Test (${{ matrix.db }})
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres, mysql]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rust_ef_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d rust_ef_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: rust_ef_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RUST_EF_PG_URL: postgres://test:test@localhost:5432/rust_ef_test
      RUST_EF_MYSQL_URL: mysql://root:test@localhost:3306/rust_ef_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: |
          case "${{ matrix.db }}" in
            sqlite)
              cargo test --workspace --features chrono,uuid,decimal -- --skip postgres --skip mysql
              ;;
            postgres)
              cargo test --workspace --features chrono,uuid,decimal --test postgres_crud_tests
              ;;
            mysql)
              cargo test --workspace --features chrono,uuid,decimal --test mysql_crud_tests
              ;;
          esac
