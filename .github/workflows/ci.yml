name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (chrono/uuid/decimal features)
        run: cargo clippy --workspace --all-targets --features chrono,uuid,decimal -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check single rust-dix version
        run: |
          set -euo pipefail
          count="$(cargo tree -i rust-dix | grep -c '^rust-dix v')"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one rust-dix version, found $count"
            cargo tree -i rust-dix
            exit 1
          fi
      - name: Rustdoc (warnings as errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features

  package:
    name: Package (release artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify publishable crate packaging metadata
        run: |
          set -euo pipefail
          # Full `cargo package` for dependent crates needs their released
          # dependencies on crates.io (only true after publication), so CI
          # verifies the file lists plus a full package of the leaf crate.
          cargo package -p rust-ef-macros
          for name in rust-ef rust-ef-sqlite rust-ef-postgres rust-ef-mysql; do
            echo "::group::Packaging $name"
            cargo package -p "$name" --no-verify --list > "/tmp/$name.files"
            grep -qx "README.md" "/tmp/$name.files" \
              || { echo "::error::$name package is missing README.md"; exit 1; }
            grep -qx "Cargo.toml" "/tmp/$name.files" \
              || { echo "::error::$name package is missing Cargo.toml"; exit 1; }
            echo "::endgroup::"
          done

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Audit dependencies
        run: cargo audit

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace on MSRV
        run: cargo check --workspace --all-targets --all-features

  test:
    name: Test (${{ matrix.db }})
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres, mysql]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rust_ef_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d rust_ef_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: rust_ef_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RUST_EF_PG_URL: postgres://test:test@localhost:5432/rust_ef_test
      RUST_EF_MYSQL_URL: mysql://root:test@localhost:3306/rust_ef_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: |
          case "${{ matrix.db }}" in
            sqlite)
              cargo test --workspace --all-features -- --skip postgres --skip mysql
              ;;
            postgres)
              cargo test --workspace --features chrono,uuid,decimal --test postgres_crud_tests -- --test-threads=1
              ;;
            mysql)
              cargo test --workspace --features chrono,uuid,decimal --test mysql_crud_tests -- --test-threads=1
              ;;
          esac

  provider-smoke:
    name: Provider smoke (${{ matrix.db }})
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres, mysql]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rust_ef_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d rust_ef_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: rust_ef_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RUST_EF_PG_URL: postgres://test:test@localhost:5432/rust_ef_test
      RUST_EF_MYSQL_URL: mysql://root:test@localhost:3306/rust_ef_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Provider parity (generate -> apply -> introspect)
        run: |
          case "${{ matrix.db }}" in
            sqlite)
              cargo run --package rust-ef-providers-example -- --provider sqlite --url /tmp/rust_ef_provider_smoke.db
              ;;
            postgres)
              cargo run --package rust-ef-providers-example -- --provider postgres --url "$RUST_EF_PG_URL"
              ;;
            mysql)
              cargo run --package rust-ef-providers-example -- --provider mysql --url "$RUST_EF_MYSQL_URL"
              ;;
          esac
      - name: Real-database introspection assertions
        if: matrix.db != 'sqlite'
        run: |
          cargo test -p rust-ef --features chrono,uuid,decimal \
            --test provider_parity_tests -- --ignored --test-threads=1

  # Real-database coverage that cannot run on SQLite. This job is deliberately
  # separate from `lint`/`test`: a database or service-container problem must
  # never fail the default gate. It runs on regular pushes and on non-draft PRs.
  db-integration:
    name: DB integration (ignored real-database tests)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ef_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ef_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ef_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RUST_EF_MYSQL_URL: mysql://root:root@127.0.0.1:3306/ef_ci?ssl-mode=disabled
      RUST_EF_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/ef_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Provider parity (real MySQL + PostgreSQL)
        run: cargo test -p rust-ef --test provider_parity_tests -- --ignored --nocapture
      - name: PostgreSQL NULL binding (real PostgreSQL)
        run: cargo test -p rust-ef --test postgres_null_binding -- --ignored --nocapture

