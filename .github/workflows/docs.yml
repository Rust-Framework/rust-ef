name: Docs (mdBook)

on:
  push:
    branches: [main, master]
    paths:
      - "docs/rust-ef/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          mkdir mdbook
          curl -sSL https://github.com/rust-lang/mdBook/releases/latest/download/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz -o mdbook/mdbook
          chmod +x mdbook/mdbook
          echo "$PWD/mdbook" >> $GITHUB_PATH
      - name: Build book
        run: mdbook build docs/rust-ef
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/rust-ef/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
