[package]
name = "rust-ef-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for Rust Entity Framework migrations"
publish = false
keywords = ["orm", "efcore", "migration", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "rust-ef"
path = "src/main.rs"
# The binary shares its name with the rust-ef library crate; skip bin docs so
# `cargo doc --workspace` does not hit an output filename collision.
doc = false

[dependencies]
rust-ef = { version = "2.2.0", path = "../core" }
rust-ef-sqlite = { version = "2.2.0", path = "../sqlite" }
rust-ef-postgres = { version = "2.2.0", path = "../postgres" }
rust-ef-mysql = { version = "2.2.0", path = "../mysql" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
