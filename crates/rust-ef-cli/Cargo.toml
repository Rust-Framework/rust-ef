[package]
name = "rust-ef-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI tool for Rust Entity Framework migrations and scaffolding"
keywords = ["orm", "efcore", "entity-framework", "cli", "migration"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "rust-ef"
path = "src/main.rs"

[dependencies]
rust-ef = { version = "0.3.3", path = "../rust-ef" }
rust-ef-postgres = { version = "0.3.3", path = "../rust-ef-postgres" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
