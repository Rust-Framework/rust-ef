[package]
name = "rust-ef"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust Entity Framework - An EFCore-inspired ORM for Rust"
keywords = ["orm", "efcore", "entity-framework", "database", "postgresql"]
categories = ["database"]

[dependencies]
rust-ef-macros = { version = "2.5.0", path = "../macros" }
rust-dix = "1.0"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
chrono = { version = "0.4", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
rust_decimal = { version = "1", optional = true }
inventory = { workspace = true }
tracing = { version = "0.1", optional = true }
# Optional `webx` integration: `impl From<EFError> for rust_webx_core::error::Error`
# (XR-1). Published range is "1.2"; rust-webx 1.3/1.4 is semver-compatible, and
# the rust-webx workspace patches this to its local checkout for co-development.
rust-webx-core = { version = "1.2", optional = true }

[dev-dependencies]
rust-ef-sqlite = { path = "../sqlite" }
rust-ef-postgres = { path = "../postgres" }
rust-ef-mysql = { path = "../mysql" }
criterion = { version = "0.5", features = ["async_tokio"] }

[features]
default = []
serde = ["dep:serde"]
chrono = ["dep:chrono", "rust-ef-macros/chrono"]
uuid = ["dep:uuid", "rust-ef-macros/uuid"]
decimal = ["dep:rust_decimal", "rust-ef-macros/decimal"]
tracing = ["dep:tracing"]
webx = ["dep:rust-webx-core"]

[[bench]]
name = "bench_insert"
harness = false

[[bench]]
name = "bench_query"
harness = false

[[bench]]
name = "bench_include"
harness = false

[[bench]]
name = "bench_save"
harness = false

[[bench]]
name = "bench_detect_changes"
harness = false

[[bench]]
name = "bench_snapshot"
harness = false
