[package]
name = "rust-ef-mysql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MySQL provider for Rust Entity Framework"
keywords = ["orm", "efcore", "entity-framework", "mysql", "database"]
categories = ["database"]

[dependencies]
# Feature unification: see sqlite/Cargo.toml for rationale. MySQL collapses
# native chrono/uuid/decimal variants to their canonical string form in
# `type_conversion.rs` (MySQL's DATETIME/CHAR(36)/DECIMAL columns accept
# string input and preserve precision, matching v1.0 behavior).
rust-ef = { version = "2.3.0", path = "../core", features = ["chrono", "uuid", "decimal"] }
async-trait = "0.1"
# Depend on the driver/core crates directly instead of the `sqlx` umbrella:
# the umbrella resolves its optional SQLite driver into the lock graph, which
# conflicts with `rusqlite`'s libsqlite3-sys 0.39 (`links = "sqlite3"`) even
# when the `sqlite` feature is off. The `rsa` backend is needed for MySQL 8's
# caching_sha2_password over plaintext (local dev/tests); sqlx-mysql 0.9
# requires rsa >=0.10.0-rc.18, which resolves to the fixed rsa 0.10.0.
sqlx-core = { version = "0.9", default-features = false, features = ["_rt-tokio", "_tls-native-tls"] }
sqlx-mysql = { version = "0.9", default-features = false, features = ["chrono", "uuid", "rsa"] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rust_decimal = "1"
tracing = { version = "0.1", optional = true }

[features]
tracing = ["dep:tracing", "rust-ef/tracing"]
